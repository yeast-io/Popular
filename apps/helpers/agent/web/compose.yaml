# Defaults: published image, local access, Docker-managed storage.
# First start: docker compose --profile setup run --rm init-secrets
# Then: docker compose up -d agent
services:
  agent:
    image: ${AGENT_IMAGE:-ghcr.io/yeast-io/popular-agent:0.1.1-beta.1-647526a803ef}
    ports:
      - '${AGENT_PUBLISH_ADDRESS:-127.0.0.1}:${AGENT_WEB_PORT:-1423}:1423'
    environment:
      AGENT_WEB_ORIGIN: ${AGENT_WEB_ORIGIN:-http://127.0.0.1:${AGENT_WEB_PORT:-1423}}
      AGENT_SESSION_TTL_SECONDS: ${AGENT_SESSION_TTL_SECONDS:-28800}
      VERBOSE: ${VERBOSE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - '${AGENT_DATA_MOUNT:-agent-data}:/var/lib/popular-agent'
      - '${AGENT_SECRETS_MOUNT:-agent-secrets}:/run/agent-secrets:ro'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    stop_grace_period: 15s
    restart: unless-stopped
  init-secrets:
    profiles: [setup]
    image: ${AGENT_IMAGE:-ghcr.io/yeast-io/popular-agent:0.1.1-beta.1-647526a803ef}
    command: ['--init-secrets', '/run/agent-secrets']
    volumes:
      - '${AGENT_SECRETS_MOUNT:-agent-secrets}:/run/agent-secrets'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  agent-data:
  agent-secrets:
