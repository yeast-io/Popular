<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Popular</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #10151d; color: #e7edf5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(880px, 100%); margin: 10vh auto; padding: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { color: #79decb; letter-spacing: .15em; font-weight: 650; }
    h1 { margin: 48px 0 12px; font-size: clamp(28px, 5vw, 44px); }
    p { color: #a9b7c9; line-height: 1.7; }
    h2 { font-size: 15px; margin-top: 40px; }
    select { font: inherit; padding: 8px; border-radius: 8px; background: #1c2838; color: inherit; border: 1px solid #3b4d65; }
    .project { display: flex; justify-content: space-between; gap: 20px; margin: 12px 0; padding: 24px; border: 1px solid #3b4d65; border-radius: 12px; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
    .project:hover { border-color: #79decb; background: #182332; }
    :focus-visible { outline: 3px solid #79decb; outline-offset: 4px; }
    @media (prefers-color-scheme: light) { :root { background: #f5f7fa; color: #182638; } p { color: #526478; } .brand { color: #087966; } select { background: white; } .project:hover { background: #e5f3ef; } }
  </style>
</head>
<body>
  <main>
    <header><span class="brand">POPULAR</span><select aria-label="Language"><option value="zh-CN">简体中文</option><option value="en-US">English</option></select></header>
    <h1 data-message="heading"></h1>
    <p data-message="description"></p>
    <section aria-labelledby="projects"><h2 id="projects" data-message="projects"></h2><!-- PROJECTS --><p data-message="empty" hidden></p></section>
  </main>
  <script type="module" src="./docs.messages.js"></script>
</body>
</html>
