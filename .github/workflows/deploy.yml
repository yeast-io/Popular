name: Deploy Web And API Services

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: popular-production
  cancel-in-progress: false

jobs:
  detect:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      api_tag: ${{ steps.versions.outputs.api_tag }}
      web_tag: ${{ steps.versions.outputs.web_tag }}
      gateway_tag: ${{ steps.versions.outputs.gateway_tag }}
      deploy_api: ${{ steps.versions.outputs.deploy_api }}
      deploy_web: ${{ steps.versions.outputs.deploy_web }}
      deploy_gateway: ${{ steps.versions.outputs.deploy_gateway }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"

          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]

          umask 077
          ssh_dir="$RUNNER_TEMP/popular-ssh"
          mkdir -p "$ssh_dir"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          cat > "$ssh_dir/config" <<EOF
          Host popular
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile $ssh_dir/key
            UserKnownHostsFile $ssh_dir/known_hosts
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF

      - name: Read successful deployment versions
        run: |
          set -euo pipefail

          ssh -F "$RUNNER_TEMP/popular-ssh/config" popular \
            'if test -f "$HOME/popular-deploy/.env"; then cat "$HOME/popular-deploy/.env"; fi' \
            > "$RUNNER_TEMP/popular-deployed.env"

      - name: Detect version changes
        id: versions
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const version = (file) => {
            const value = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            if (typeof value !== 'string' || !/^[A-Za-z0-9_][A-Za-z0-9_.-]*$/.test(value)) {
              throw new Error(`Version cannot be used in a Docker tag: ${file}`);
            }
            return value;
          };
          const contract = version('packages/contract/package.json');
          const tags = {
            api: `${version('apps/api/package.json')}-contract.${contract}`,
            web: `${version('apps/web/package.json')}-contract.${contract}`,
            gateway: `${version('apps/helpers/gateway/package.json')}-contract.${contract}`,
          };

          const previous = {};
          const state = fs.readFileSync(
            path.join(process.env.RUNNER_TEMP, 'popular-deployed.env'),
            'utf8',
          );

          for (const line of state.split(/\r?\n/)) {
            const match = line.match(/^(API_IMAGE_TAG|WEB_IMAGE_TAG|GATEWAY_IMAGE_TAG)=(.*)$/);
            if (match) {
              previous[match[1]] = match[2].trim().replace(/^(['"])(.*)\1$/, '$2');
            }
          }

          for (const service of ['api', 'web', 'gateway']) {
            const tag = tags[service];
            if (tag.length > 128) {
              throw new Error(`Image tag exceeds 128 characters: ${service}`);
            }

            const key = `${service.toUpperCase()}_IMAGE_TAG`;
            const changed = previous[key] !== tag;

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `${service}_tag=${tag}\ndeploy_${service}=${changed}\n`,
            );

            console.log(`${service}: ${previous[key] || '(none)'} -> ${tag}; deploy=${changed}`);
          }
          NODE

      - name: Clean up SSH credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/popular-ssh"

  deploy-api:
    needs: detect
    if: needs.detect.outputs.deploy_api == 'true'
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: api
      api_tag: ${{ needs.detect.outputs.api_tag }}
      web_tag: ${{ needs.detect.outputs.web_tag }}
      gateway_tag: ${{ needs.detect.outputs.gateway_tag }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

  deploy-web:
    needs: [detect, deploy-api]
    if: ${{ always() && !cancelled() && needs.detect.result == 'success' && needs.detect.outputs.deploy_web == 'true' && (needs['deploy-api'].result == 'success' || needs['deploy-api'].result == 'skipped') }}
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: web
      api_tag: ${{ needs.detect.outputs.api_tag }}
      web_tag: ${{ needs.detect.outputs.web_tag }}
      gateway_tag: ${{ needs.detect.outputs.gateway_tag }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

  deploy-gateway:
    needs: detect
    if: needs.detect.outputs.deploy_gateway == 'true'
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: gateway
      api_tag: ${{ needs.detect.outputs.api_tag }}
      web_tag: ${{ needs.detect.outputs.web_tag }}
      gateway_tag: ${{ needs.detect.outputs.gateway_tag }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
